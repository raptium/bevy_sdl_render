[package]
name = "bevy_sdl_render"
version = "0.1.0"
edition = "2024"

[features]
debug = ["bevy/debug"]

[dependencies]
bevy = { version = "0.19.0-rc.1", default-features = false, features = ["default_app", "std", "multi_threaded", "bevy_asset", "bevy_image", "bevy_window", "bevy_sprite"] }
sdl2 = { version = "0.38.0", features = ["use-pkgconfig"] }
wgpu-types = { version = "29.0.3", default-features = false }
